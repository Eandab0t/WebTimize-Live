name: Build release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  artifacts:
    name: Build and attach browser packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify release tag matches extension version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const fs=require('node:fs'); const tag=process.env.RELEASE_TAG.replace(/^v/, ''); const version=JSON.parse(fs.readFileSync('manifest.json', 'utf8')).version; if (tag !== version) throw new Error(`release tag ${tag} does not match extension version ${version}`);"

      - name: Install and test
        run: |
          npm install --ignore-scripts
          npm test

      - name: Build browser packages
        run: |
          npm run build
          pwsh -NoProfile -File scripts/package-extension.ps1 -Browser chrome -ForSubmission
          pwsh -NoProfile -File scripts/package-extension.ps1 -Browser firefox -ForSubmission

      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
